<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banking Receipt Resilience Engine | Core Banking</title>
<link rel="stylesheet" href="https://googleapis.com">
<style>
  :root {
    --fundo: #F1F5F9;
    --azul-escuro: #002B7A;
    --azul-medio: #0044B3;
    --texto: #0F172A;
    --suave: #64748B;
    --borda: #E2E8F0;
    --card: #FFFFFF;
    --verde: #059669;
    --verde-bg: #ECFDF5;
    --laranja: #EA580C;
    --laranja-bg: #FFF7ED;
    --vermelho: #E11D48;
    --vermelho-bg: #FFF1F2;
    --azul-bg: #EFF6FF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  header {
    background: linear-gradient(135deg, var(--azul-escuro), var(--azul-medio));
    color: #fff;
    padding: 18px 16px;
    box-shadow: 0 2px 8px rgba(0, 43, 122, 0.15);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #fff;
    color: var(--azul-escuro);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 800; }
  .brand p { margin: 2px 0 0; font-size: 0.78rem; color: #DBEAFE; }

  .controles { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-auto {
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.15);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34D399;
  }
  .dot.off { background: #94A3B8; }
  .btn-simular {
    border: 0;
    background: #fff;
    color: var(--azul-escuro);
    padding: 8px 14px;
    border-radius: 8px;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }

  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }

  .kpis {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (min-width: 720px) {
    .kpis { grid-template-columns: repeat(4, 1fr); }
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .kpi-card small { display: block; font-size: 0.76rem; color: var(--suave); font-weight: 600; }
  .kpi-card strong { display: block; font-size: 1.65rem; font-weight: 800; margin: 4px 0 2px; color: var(--azul-escuro); }
  .kpi-card span { font-size: 0.72rem; color: var(--suave); }
  .kpi-verde strong { color: var(--verde); }
  .kpi-laranja strong { color: var(--laranja); }
  .kpi-vermelho strong { color: var(--vermelho); }

  .grid-principal {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 820px) {
    .grid-principal { grid-template-columns: 1.35fr 1fr; }
  }

  .secao-titulo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .secao-titulo h2 {
    margin: 0;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--suave);
    font-weight: 700;
  }
  .secao-titulo span { font-size: 0.74rem; color: var(--suave); }

  .tx-card {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .tx-card.retry { border: 2px solid var(--laranja); }
  .tx-card.clicavel { cursor: pointer; }
  .tx-card.clicavel:hover { border-color: var(--azul-medio); }

  .tx-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .tx-id { font-size: 0.75rem; font-weight: 700; color: var(--azul-escuro); }
  .tx-banco { font-size: 0.78rem; font-weight: 600; color: var(--suave); margin-left: 6px; }
  .tx-favorecido { margin: 4px 0 0; font-size: 0.95rem; font-weight: 700; }
  .tx-valor { font-size: 0.95rem; font-weight: 800; text-align: right; margin: 0 0 6px; }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .badge-issued { background: var(--verde-bg); color: var(--verde); border: 1px solid #A7F3D0; }
  .badge-processing { background: var(--azul-bg); color: var(--azul-medio); border: 1px solid #BFDBFE; }
  .badge-retry { background: var(--laranja-bg); color: var(--laranja); border: 1px solid #FED7AA; }
  .badge-dlq { background: var(--vermelho-bg); color: var(--vermelho); border: 1px solid #FECDD3; }
  .badge-pending { background: #F1F5F9; color: var(--suave); }

  .tx-rodape {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--borda);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--suave);
  }
  .link-recibo { color: var(--azul-escuro); font-weight: 700; text-decoration: underline; }

  .console-box {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 14px;
    height: 450px;
    overflow-y: auto;
    font-size: 0.75rem;
  }
  .log-item {
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--borda);
  }
  .log-item:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .log-head { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--suave); margin-bottom: 3px; }
  .log-tag { padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  .tag-info { background: var(--azul-bg); color: var(--azul-escuro); }
  .tag-warn { background: var(--laranja-bg); color: var(--laranja); }
  .tag-success { background: var(--verde-bg); color: var(--verde); }
  .tag-error { background: var(--vermelho-bg); color: var(--vermelho); }
  .log-msg { margin: 0; line-height: 1.4; }
  .msg-warn { color: var(--laranja); }
  .msg-success { color: var(--verde); }
  .msg-error { color: var(--vermelho); }

  .modal-fundo {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-card {
    background: #fff;
    border-radius: 18px;
    max-width: 420px;
    width: 100%;
    padding: 22px;
    box-shadow: 0 20px 35px rgba(0,0,0,0.2);
  }
  .modal-topo {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--borda);
    padding-bottom: 12px;
    margin-bottom: 14px;
  }
  .modal-topo small { color: var(--verde); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; }
  .modal-topo h3 { margin: 4px 0 0; font-size: 1.1rem; }
  .btn-fechar-x { border: 0; background: none; font-size: 1.1rem; color: var(--suave); cursor: pointer; }
  .linha-dado { display: flex; justify-content: space-between; font-size: 0.86rem; margin-bottom: 10px; }
  .linha-dado span { color: var(--suave); }
  .bloco-hash {
    background: #F8FAFC;
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 10px;
    margin-top: 12px;
    font-size: 0.75rem;
    word-break: break-all;
  }
  .bloco-hash small { display: block; color: var(--suave); margin-bottom: 2px; }
  .btn-fechar {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--azul-escuro);
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
