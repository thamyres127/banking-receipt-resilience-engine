<style>

  .status-pill {

  button:disabled { opacity: 0.55; cursor: not-allowed; }

  .erro-msg {

  .tx-item {

  .tx-favorecido {

  .tx-valor {

  .tx-meta {

  .badge {

  .st-PENDING, .st-PROCESSING { background: var(--proc-bg); color: var(--proc-txt); }
  .st-RETRY_SCHEDULED { background: var(--aviso-bg); color: var(--aviso-txt); }
  .st-ISSUED { background: var(--sucesso-bg); color: var(--sucesso-txt); }
  .st-FAILED_DLQ { background: var(--erro-bg); color: var(--erro-txt); }

  .log-box {
    background: #F8FAFC;

  .log-linha {

    color: var(--tinta);
  }
  .log-linha:last-child { border-bottom: 0; }
  .log-hora { color: var(--suave); }
  .log-tx { font-weight: 700; color: var(--azul-banco); }
  .log-ev-err { color: var(--erro-txt); font-weight: 700; }
  .log-ev-ok { color: var(--sucesso-txt); font-weight: 700; }
  .btn-limpar {
    background: transparent;
    color: var(--suave);
    border: 1px solid var(--linha);
    padding: 4px 10px;
    font-size: 0.72rem;
    border-radius: 6px;

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const BANCOS = ["Itaú Unibanco", "Nubank", "Santander", "Banco do Brasil", "Bradesco"];
  const MAX_RETRIES = 3;

  const formatarMoeda = (valor) =>
    Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  const gerarTxId = () => Math.random().toString(16).substring(2, 10).toUpperCase();

  const gerarEndToEndId = () => {
    const rand = Math.floor(Math.random() * 9000) + 1000;
    return `E${Date.now()}BR${rand}`;
  };

  const gerarHash = (texto) => {
    let hash = 0;
    for (let i = 0; i < texto.length; i++) {
      hash = (hash << 5) - hash + texto.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash).toString(16).padStart(8, "0") + "-e2e-verified";
  };

  const horaAgora = () => {
    const d = new Date();
    return d.toTimeString().split(" ")[0] + "." + String(d.getMilliseconds()).padStart(3, "0");
  };

  const esperar = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function App() {
    const [transacoes, setTransacoes] = useState([]);
    const [logs, setLogs] = useState([]);
    const [payerBank, setPayerBank] = useState(BANCOS[0]);
    const [payeeName, setPayeeName] = useState("");
    const [amount, setAmount] = useState("");
    const [erro, setErro] = useState("");
    const [processandoLote, setProcessandoLote] = useState(false);

    const logBoxRef = useRef(null);

    useEffect(() => {
      if (logBoxRef.current) {
        logBoxRef.current.scrollTop = logBoxRef.current.scrollHeight;
      }
    }, [logs]);

    const registrarLog = (transactionId, event, details) => {
      setLogs((prev) => [
        ...prev,
        { id: Date.now() + Math.random(), timestamp: horaAgora(), transactionId, event, details }
      ]);
    };

    const atualizarTransacao = (transactionId, campos) => {
      setTransacoes((prev) =>
        prev.map((tx) => (tx.transactionId === transactionId ? { ...tx, ...campos } : tx))
      );
    };

    // Espelha o método externalReceiptServiceCall + processWithResilience do Java
    const executarMotorResiliencia = async (novaTx) => {
      setTransacoes((prev) => [novaTx, ...prev]);

      registrarLog(
        novaTx.transactionId,
        "TX_RECEIVED",
        `Pix ${formatarMoeda(novaTx.amount)} -> ${novaTx.payeeName} (${novaTx.payerBank})`
      );

      let tentativa = 0;
      while (tentativa < MAX_RETRIES) {
        tentativa++;
        atualizarTransacao(novaTx.transactionId, {
          status: "PROCESSING",
          retryCount: tentativa
        });

        registrarLog(
          novaTx.transactionId,
          "GENERATING_RECEIPT",
          `Tentativa ${tentativa} de ${MAX_RETRIES}`
        );

        await esperar(550);

        // Simula instabilidade igual ao código Java (65% na 1ª, 30% na 2ª)
        const chance = Math.random() * 100;
        const falhou = (tentativa === 1 && chance < 65) || (tentativa === 2 && chance < 30);

        if (!falhou) {
          const hash = gerarHash(novaTx.endToEndId);
          atualizarTransacao(novaTx.transactionId, {
            status: "ISSUED",
            retryCount: tentativa,
            receiptHash: hash
          });
          registrarLog(
            novaTx.transactionId,
            "RECEIPT_ISSUED",
