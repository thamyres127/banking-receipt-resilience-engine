<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Motor de Resiliência Bancária • Comprovantes Pix</title>
<style>
  :root { color-scheme: light only; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background-color: #F4F6F9 !important; color: #102542 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  header { background: #FFFFFF !important; border-bottom: 1px solid #DCE2E8; padding: 14px 16px; position: sticky; top: 0; z-index: 10; }
  .header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo-badge { width: 36px; height: 36px; border-radius: 10px; background: #EC7000; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .brand h1 { font-size: 0.98rem; font-weight: 800; margin: 0; }
  .brand small { display: block; font-size: 0.72rem; color: #5C6B73; }
  .status-pill { font-size: 0.72rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #E6F7ED; color: #137333; }
  .status-pill.pausado { background: #FEF3C7; color: #B45309; }
  main { max-width: 600px; margin: 0 auto; padding: 16px 16px 50px; }
  .resumo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi, .card { background: #FFFFFF !important; border: 1px solid #DCE2E8; border-radius: 14px; padding: 14px; }
  .kpi small { display: block; font-size: 0.72rem; font-weight: 600; color: #5C6B73; }
  .kpi strong { display: block; font-size: 1.4rem; font-weight: 800; margin-top: 4px; }
  .kpi.destaque strong { color: #137333; }
  .kpi.alerta strong { color: #B91C1C; }
  .card { margin-bottom: 14px; }
  .card-title { font-size: 0.9rem; font-weight: 800; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .controles-auto { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { padding: 12px; font: inherit; font-size: 0.85rem; font-weight: 800; border: 0; border-radius: 10px; cursor: pointer; }
  .btn-primario { background: #EC7000; color: #FFFFFF; }
  .btn-secundario { background: #003399; color: #FFFFFF; }
  .btn-limpar { background: transparent; color: #5C6B73; border: 1px solid #DCE2E8; padding: 4px 10px; font-size: 0.72rem; border-radius: 6px; }
  .tx-item { border: 1px solid #DCE2E8; border-radius: 12px; padding: 11px; margin-bottom: 10px; background: #FAFBFD; }
  .tx-item:last-child { margin-bottom: 0; }
  .tx-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tx-banco { font-size: 0.72rem; font-weight: 800; color: #003399; text-transform: uppercase; }
  .tx-favorecido { font-size: 0.92rem; font-weight: 800; margin: 2px 0; }
  .tx-valor { font-size: 0.98rem; font-weight: 800; white-space: nowrap; }
  .tx-meta { margin-top: 7px; padding-top: 7px; border-top: 1px dashed #DCE2E8; font-size: 0.74rem; color: #5C6B73; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; margin-top: 4px; }
  .st-PENDING, .st-PROCESSING { background: #E0F2FE; color: #0369A1; }
  .st-RETRY_SCHEDULED { background: #FEF3C7; color: #B45309; }
  .st-ISSUED { background: #E6F7ED; color: #137333; }
  .st-FAILED_DLQ { background: #FEE2E2; color: #B91C1C; }
  .log-box { background: #F8FAFC; border: 1px solid #DCE2E8; border-radius: 10px; padding: 10px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.72rem; line-height: 1.45; }
  .log-linha { padding: 4px 0; border-bottom: 1px solid #EDF2F7; }
  .log-hora { color: #5C6B73; }
  .log-tx { font-weight: 700; color: #003399; }
  .log-ev-err { color: #B91C1C; font-weight: 700; }
  .log-ev-ok { color: #137333; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo-badge">BR</div>
      <div><h1>Receipt Resilience Engine</h1><small>Java + SQL • Simulador Automático Pix</small></div>
    </div>
    <span id="badge-modo" class="status-pill">● Auto-Run Ativo</span>
  </div>
</header>
<main>
  <section class="resumo-grid">
    <div class="kpi"><small>Transações</small><strong id="kpi-total">0</strong></div>
    <div class="kpi destaque"><small>Emitidos (OK)</small><strong id="kpi-emitidos">0</strong></div>
    <div class="kpi alerta"><small>Fila DLQ</small><strong id="kpi-dlq">0</strong></div>
  </section>
  <section class="card">
    <h2 class="card-title">Controle da Simulação Automática</h2>
    <div class="controles-auto">
      <button id="btn-toggle-auto" class="btn-primario" type="button">Pausar Automático</button>
      <button id="btn-nova-tx" class="btn-secundario" type="button">+ Nova TX Agora</button>
    </div>
  </section>
  <section class="card">
    <h2 class="card-title">Ciclo de Vida dos Comprovantes</h2>
    <div id="lista-transacoes"></div>
  </section>
  <section class="card">
    <h2 class="card-title"><span>Audit Log (Tabela SQL)</span><button id="btn-limpar" class="btn-limpar" type="button">Limpar</button></h2>
    <div id="log-box" class="log-box"></div>
  </section>
</main>
<script>
  const MAX_RETRIES = 3;
  let transacoes = [], autoAtivo = true, processando = false, indiceCenario = 0;
  const CENARIOS_PIX = [
    { payerBank: "Itaú Unibanco", payeeName: "Mercado Livre Pagamentos", amount: 249.90 },
    { payerBank: "Nubank", payeeName: "Energia Enel SP", amount: 184.50 },
    { payerBank: "Santander", payeeName: "Transferência João Silva", amount: 1200.00 },
    { payerBank: "Itaú Unibanco", payeeName: "iFood Brasil Serviços", amount: 68.40 },
    { payerBank: "Banco do Brasil", payeeName: "Sabesp Saneamento", amount: 112.80 },
    { payerBank: "Bradesco", payeeName: "Amazon Serviços Varejo", amount: 359.00 }
  ];
  function formatarMoeda(v) { return "R$ " + Number(v).toFixed(2).replace(".", ","); }
  function gerarTxId() { return Math.random().toString(16).substring(2, 10).toUpperCase(); }
  function gerarEndToEndId() { return "E" + Date.now() + "BR" + (Math.floor(Math.random() * 9000) + 1000); }
  function gerarHash(t) {
    let h = 0;
    for (let i = 0; i < t.length; i++) { h = (h << 5) - h + t.charCodeAt(i); h |= 0; }
    return Math.abs(h).toString(16).padStart(8, "0") + "-e2e-ok";
  }
  function horaAgora() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0");
  }
  function esperar(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }
  function traduzirStatus(st) {
    return { PENDING: "Pendente", PROCESSING: "Processando...", RETRY_SCHEDULED: "Retry Agendado", ISSUED: "Comprovante Emitido", FAILED_DLQ: "Contingência (DLQ)" }[st] || st;
  }
  function registrarLog(txId, event, details) {
    const box = document.getElementById("log-box");
    const linha = document.createElement("div");
    linha.className = "log-linha";
    const cl = (event.indexOf("INSTABILITY") !== -1 || event.indexOf("DLQ") !== -1) ? "log-ev-err" : (event.indexOf("ISSUED") !== -1 ? "log-ev-ok" : "");
    linha.innerHTML = '<span class="log-hora">[' + horaAgora() + ']</span> <span class="log-tx">TX:' + txId + '</span> | <span class="' + cl + '">' + event + '</span> | ' + details;
    box.appendChild(linha);
    box.scrollTop = box.scrollHeight;
  }
  function atualizarTela() {
    document.getElementById("kpi-total").textContent = String(transacoes.length);
    document.getElementById("kpi-emitidos").textContent = String(transacoes.filter(function(t) { return t.status === "ISSUED"; }).length);
    document.getElementById("kpi-dlq").textContent = String(transacoes.filter(function(t) { return t.status === "FAILED_DLQ"; }).length);
    const lista = document.getElementById("lista-transacoes");
    if (transacoes.length === 0) {
      lista.innerHTML = '<p style="color:#5C6B73;font-size:0.85rem;text-align:center;margin:0;">Iniciando primeira transação...</p>';
      return;
    }
    let html = "";
    for (let i = 0; i < Math.min(transacoes.length, 6); i++) {
      const tx = transacoes[i];
      const hashHtml = tx.receiptHash ? '<span>Hash: <b>' + tx.receiptHash.slice(0, 12) + '</b></span>' : '';
      html += '<div class="tx-item"><div class="tx-topo"><div><div class="tx-banco">' + tx.payerBank + ' • TX #' + tx.transactionId + '</div><div class="tx-favorecido">' + tx.payeeName + '</div></div><div style="text-align:right;"><div class="tx-valor">' + formatarMoeda(tx.amount) + '</div><span class="badge st-' + tx.status + '">' + traduzirStatus(tx.status) + '</span></div></div><div class="tx-meta"><span>Tentativas: <b>' + tx.retryCount + '/' + MAX_RETRIES + '</b></span><span>E2E: ' + tx.endToEndId.slice(0, 14) + '...</span>' + hashHtml + '</div></div>';
    }
    lista.innerHTML = html;
  }
  async function executarMotorResiliencia(tx) {
    processando = true;
    transacoes.unshift(tx);
    atualizarTela();
    registrarLog(tx.transactionId, "TX_RECEIVED", "Pix " + formatarMoeda(tx.amount) + " -> " + tx.payeeName + " (" + tx.payerBank + ")");
    let tentativa = 0;
    while (tentativa < MAX_RETRIES) {
      tentativa++;
      tx.status = "PROCESSING";
      tx.retryCount = tentativa;
      atualizarTela();
      registrarLog(tx.transactionId, "GENERATING_RECEIPT", "Tentativa " + tentativa + " de " + MAX_RETRIES);
      await esperar(600);
      const chance = Math.random() * 100;
      const falhou = (tentativa === 1 && chance < 65) || (tentativa === 2 && chance < 30);
      if (!falhou) {
        tx.status = "ISSUED";
        tx.receiptHash = gerarHash(tx.endToEndId);
        atualizarTela();
