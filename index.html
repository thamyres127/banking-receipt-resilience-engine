<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const BANCOS = ["Itaú Unibanco", "Nubank", "Santander", "Banco do Brasil", "Bradesco"];
  const MAX_RETRIES = 3;

  function formatarMoeda(valor) {
    return Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  function gerarTxId() {
    return Math.random().toString(16).substring(2, 10).toUpperCase();
  }

  function gerarEndToEndId() {
    const rand = Math.floor(Math.random() * 9000) + 1000;
    return "E" + Date.now() + "BR" + rand;
  }

  function gerarHash(texto) {
    let hash = 0;
    for (let i = 0; i < texto.length; i++) {
      hash = (hash << 5) - hash + texto.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash).toString(16).padStart(8, "0") + "-e2e-verified";
  }

  function horaAgora() {
    const d = new Date();
    const partes = d.toTimeString().split(" ");
    return partes[0] + "." + String(d.getMilliseconds()).padStart(3, "0");
  }

  function esperar(ms) {
    return new Promise(function(resolve) { setTimeout(resolve, ms); });
  }

  function App() {
    const [transacoes, setTransacoes] = useState([]);
    const [logs, setLogs] = useState([]);
    const [payerBank, setPayerBank] = useState(BANCOS[0]);
    const [payeeName, setPayeeName] = useState("");
    const [amount, setAmount] = useState("");
    const [erro, setErro] = useState("");
    const [processandoLote, setProcessandoLote] = useState(false);

    const logBoxRef = useRef(null);

    useEffect(function() {
      if (logBoxRef.current) {
        logBoxRef.current.scrollTop = logBoxRef.current.scrollHeight;
      }
    }, [logs]);

    function registrarLog(transactionId, event, details) {
      setLogs(function(prev) {
        return prev.concat([{
          id: Date.now() + Math.random(),
          timestamp: horaAgora(),
          transactionId: transactionId,
          event: event,
          details: details
        }]);
      });
    }

    function atualizarTransacao(transactionId, campos) {
      setTransacoes(function(prev) {
        return prev.map(function(tx) {
          return tx.transactionId === transactionId ? Object.assign({}, tx, campos) : tx;
        });
      });
    }

    async function executarMotorResiliencia(novaTx) {
      setTransacoes(function(prev) { return [novaTx].concat(prev); });

      registrarLog(
        novaTx.transactionId,
        "TX_RECEIVED",
        "Pix " + formatarMoeda(novaTx.amount) + " -> " + novaTx.payeeName + " (" + novaTx.payerBank + ")"
      );

      let tentativa = 0;
      while (tentativa < MAX_RETRIES) {
        tentativa++;
        atualizarTransacao(novaTx.transactionId, {
          status: "PROCESSING",
          retryCount: tentativa
        });

        registrarLog(
          novaTx.transactionId,
          "GENERATING_RECEIPT",
          "Tentativa " + tentativa + " de " + MAX_RETRIES
        );

        await esperar(550);

        const chance = Math.random() * 100;
        const falhou = (tentativa === 1 && chance < 65) || (tentativa === 2 && chance < 30);

        if (!falhou) {
          const hash = gerarHash(novaTx.endToEndId);
          atualizarTransacao(novaTx.transactionId, {
            status: "ISSUED",
            retryCount: tentativa,
            receiptHash: hash
          });
          registrarLog(
            novaTx.transactionId,
            "RECEIPT_ISSUED",
            "Comprovante garantido! E2E: " + novaTx.endToEndId + " | Hash: " + hash.slice(0, 12)
          );
          return;
        }

        const motivo = tentativa === 1
          ? "Timeout na API de Extrato/Comprovante (HTTP 504)"
          : "Fila de mensageria congestionada (Lag detectado)";

        atualizarTransacao(novaTx.transactionId, {
          status: "RETRY_SCHEDULED",
          retryCount: tentativa
        });
        registrarLog(novaTx.transactionId, "INSTABILITY_CAUGHT", motivo);

        if (tentativa < MAX_RETRIES) {
